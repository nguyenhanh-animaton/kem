name: Cập nhật giá vàng 24K

on:
  schedule:
    - cron: '30 1 * * *'   # 8:30 sáng giờ Việt Nam
    - cron: '0 5 * * *'    # 12:00 trưa giờ Việt Nam (bắt lần đổi giá giữa ngày)
  workflow_dispatch:       # bấm chạy tay trong tab Actions

permissions:
  contents: write
  pages: write

concurrency:
  group: gold-price
  cancel-in-progress: false

jobs:
  gold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lấy giá vàng 24K
        run: node scripts/fetch-gold.mjs

      - name: Lưu giá mới vào kho
        run: |
          git config user.name "kem-gold-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold.json
          if git diff --cached --quiet; then
            echo "Giá không đổi"
          else
            git commit -m "Giá vàng 24K $(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')"
            git push
          fi

      - name: Dựng lại trang GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages sẽ tự dựng lại"
